[tox]
envlist = lint, format, vermin, docs, dist, test-unit, test, install_wheel
toxworkdir={env:TOX_WORK_DIR:.tox}
source_dir = pulsar
test_dir = test

[testenv]
commands =
    test-!unit: pytest -v  -m {env:PYTEST_MARK:""} {posargs} 
    test-unit: pytest -v  -m {env:PYTEST_MARK:""} --ignore-glob='*integration*.py' {posargs}
    # Whole tree; ruff.toml's extend-exclude decides what is out of scope.
    lint: ruff check .
    # Checks the whole tree, matching `make format`, so tools/ stays sorted too.
    format: isort --check --diff .
    # Python 3.7 stdlib-API floor; ruff's target-version covers syntax.
    vermin: vermin -t=3.7- --violations --backport typing_extensions {[tox]source_dir} {[tox]test_dir}
    dist: make lint-dist
    docs: make lint-docs
    install_wheel: make test-install-wheel
    mypy: mypy {[tox]source_dir} {[tox]test_dir}

deps =
    test,docs,mypy: -rrequirements.txt
    test,install_wheel,mypy: -rdev-requirements.txt
    test: drmaa
    lint: ruff
    format: isort
    vermin: vermin
    docs: -r docs/requirements.txt
    dist: build
    dist: twine

setenv =
    # tests ready to go after setup_tests.sh
    ci: PYTEST_MARK="not test_requires_tes and not test_requires_kubernetes"
    funnel: PYTEST_MARK="test_requires_tes"
    kubernetes: PYTEST_MARK="test_requires_kubernetes"

passenv =
    PULSAR_*
    FUNNEL_*
    GO*
    GIT*
    HOME
    USER
    DRMAA_LIBRARY_PATH
    GITHUB_STEP_SUMMARY

skip_install =
    lint,format,vermin,dist,install_wheel: True

skipsdist = 
    docs: True

allowlist_externals =
    docs,dist,install_wheel: make
