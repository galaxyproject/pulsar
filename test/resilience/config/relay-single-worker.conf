; Run the relay as a single uvicorn worker.
;
; The image ships ``--workers 4``, and the relay's PollManager - the
; registry of parked long-poll waiters - lives in each worker's own
; ``app.state``. With four workers a waiter is visible to one process out
; of four, which breaks the harness two ways:
;
;   - ``/messages/poll/stats`` answers from whichever worker accepts the
;     request, so the readiness check in ``wait_until_consuming`` reads a
;     shard that usually does not hold Pulsar's waiter. Connection
;     distribution is sticky enough that a run can miss it for the whole
;     timeout and fail with a consumer Pulsar demonstrably has.
;   - ``broadcast_to_topic`` only wakes waiters in the publishing worker.
;     A client recovers a missed message from storage on its next poll,
;     but only once it has a message id to send as ``since`` - so the
;     first message on a topic can be dropped outright.
;
; One worker is ample for a fault-injection stack: the polls are asyncio,
; not CPU work. Supervisord reads conf.d in order and later files win, so
; only the command is restated here.
[program:pulsar-relay]
command=/usr/bin/python3 -m uvicorn pulsar_relay.main:app --host 0.0.0.0 --port 8080 --workers 1
