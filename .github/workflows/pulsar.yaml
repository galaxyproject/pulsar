name: pulsar
on: [push, pull_request]
permissions: {}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        tox-env: [lint, docs, format, vermin]
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install tox
      run: pip install tox
    - name: Run lint
      run: tox -e ${{ matrix.tox-env }}
  mypy:
    name: Type Check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tox-env: [mypy, pyrefly]
        python-version: ['3.14']
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install tox
      run: pip install tox
    - name: Setup pycurl
      run: sudo apt update; sudo apt install -y libxml2-dev libxslt1-dev libcurl4-openssl-dev openssh-server
    - name: Run tox
      run: tox -e ${{ matrix.tox-env }}
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tox-env: [test-ci, test-unit]
        # 3.7 is still supported but not exercised: no 3.7 build exists for 24.04.
        # ruff's target-version and tox -e vermin hold the floor statically.
        python-version: ['3.11', '3.12', '3.13', '3.14']
        include:
        - tox-env: install_wheel
          python-version: '3.10'
    services:
      job-files:
        image: galaxy/simple-job-files@sha256:b8d92c4d6b547b27f8c4ae42a53f7b43b3c680aa56232151a1ecf4671ee2cb69
        env:
          JOB_FILES_ROOT_DIRECTORY: /tmp
        ports:
          - '8000:8000'
        volumes:
          - '/tmp:/tmp:rw'
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install tox
      run: pip install tox
    - name: Run setup
      run: .ci/setup_tests.sh
    - name: Preload EngageQueue container fixture
      if: matrix.tox-env != 'install_wheel'
      run: docker pull alpine@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
    - name: Run tests
      run: . local_env.sh; tox -e ${{ matrix.tox-env }}
      env:
        PULSAR_TEST_KEY: "test_data/testkey"
        PULSAR_TEST_EXTERNAL_JOB_FILES_URL: "http://localhost:8000"
        PULSAR_TEST_EXTERNAL_JOB_FILES_DIRECTORY: "/tmp"
        TEST_WEBAPP_POST_SHUTDOWN_SLEEP: 1
  engagequeue-macos:
    name: Native EngageQueue (${{ matrix.runner }}, Python 3.12)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-15-intel
          machine: x86_64
        - runner: macos-26
          machine: arm64
    env:
      CONDA_PKGS_DIRS: ${{ github.workspace }}/.cache/conda/pkgs
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      PYTHONDONTWRITEBYTECODE: '1'
      TEST_WEBAPP_POST_SHUTDOWN_SLEEP: '1'
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Install native Miniforge
      shell: bash
      run: |
        if [ ! -x "$HOME/miniforge3/bin/conda" ]; then
          curl -fsSL "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-MacOSX-$(uname -m).sh" -o "$RUNNER_TEMP/miniforge.sh"
          bash "$RUNNER_TEMP/miniforge.sh" -b -p "$HOME/miniforge3"
        fi
    - name: Create project-local environment
      run: '"$HOME/miniforge3/bin/conda" create -y --prefix "$PWD/.conda/pulsar" --override-channels -c conda-forge python=3.12 pip'
    - name: Install Pulsar and optional executor test dependencies
      run: .conda/pulsar/bin/python -m pip install -e . 'engagequeue==0.1.1' pytest pytest-timeout responses webtest simple-job-files
    - name: Require native macOS and the published executor
      run: |
        .conda/pulsar/bin/python - <<'PY'
        import importlib.metadata
        import platform
        import sys
        from pathlib import Path
        import engagequeue

        assert sys.platform == 'darwin'
        assert sys.version_info[:2] == (3, 12)
        assert platform.machine() == '${{ matrix.machine }}'
        assert importlib.metadata.version('engagequeue') == '0.1.1'
        assert Path(engagequeue.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
        PY
    - name: Native foreground execution and client compatibility
      run: |
        PATH="$PWD/.conda/pulsar/bin:$PATH" .conda/pulsar/bin/python -m pytest -q --timeout=60 --junitxml=reports/engagequeue-macos.xml \
          test/engagequeue_cli_test.py test/engagequeue_optional_test.py \
          test/collection_ack_test.py test/cli_test.py test/stateful_test.py
    - name: Save native macOS reports
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: pulsar-engagequeue-${{ matrix.runner }}-py312
        path: reports/engagequeue-macos.xml
        if-no-files-found: ignore
  resilience:
    name: Resilience Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Install test runner deps
      run: pip install pytest pytest-timeout requests
    - name: Install pulsar for the harness
      # The scenarios import pulsar.testing.resilience. --no-deps because the
      # harness only needs requests (installed above) and the recorder is
      # pure stdlib; the runner never starts a Pulsar server itself.
      run: pip install --no-deps -e .
    - name: Build images
      run: docker compose -f test/resilience/docker-compose.yml build
    - name: Bring up the docker-compose stack
      run: docker compose -f test/resilience/docker-compose.yml up -d
    - name: Wait for stack
      run: |
        # Toxiproxy admin API is the readiness signal — when it answers,
        # rabbitmq, relay, valkey and mock-galaxy have all reached a usable
        # state because they're toxiproxy's depends_on chain.
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8474/version >/dev/null; then
            echo "stack ready"; exit 0;
          fi
          sleep 2
        done
        echo "stack did not become ready" >&2
        docker compose -f test/resilience/docker-compose.yml ps
        docker compose -f test/resilience/docker-compose.yml logs
        exit 1
    - name: Run resilience suite
      # Fail-fast (-x) for the first CI run on this job: if a scenario
      # fails we want diagnostics quickly, not 45 minutes of cascade. The
      # captured docker logs from the next step are scoped to whatever
      # was happening when the first failure hit. Drop -x once the job
      # is stable.
      run: pytest test/resilience -v -x --keep-stack
      env:
        PYTHONUNBUFFERED: "1"
    - name: Show stack logs on failure
      if: failure()
      run: |
        echo "=== ps ==="
        docker compose -f test/resilience/docker-compose.yml ps
        echo "=== pulsar ==="
        docker compose -f test/resilience/docker-compose.yml logs --no-color --timestamps pulsar | tail -800
        echo "=== mock-galaxy ==="
        docker compose -f test/resilience/docker-compose.yml logs --no-color --timestamps mock-galaxy | grep -vE "GET /_recorder/events" | tail -400
        echo "=== rabbitmq ==="
        docker compose -f test/resilience/docker-compose.yml logs --tail=100 rabbitmq
        echo "=== relay ==="
        docker compose -f test/resilience/docker-compose.yml logs --no-color --timestamps relay | tail -400
        echo "=== toxiproxy ==="
        docker compose -f test/resilience/docker-compose.yml logs --no-color --timestamps toxiproxy | tail -200
    - name: Tear down
      if: always()
      run: docker compose -f test/resilience/docker-compose.yml down -v
