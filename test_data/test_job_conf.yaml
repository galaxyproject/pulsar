runners:
  local:
    load: galaxy.jobs.runners.local:LocalJobRunner
    workers: 1
  pulsar:
    load: galaxy.jobs.runners.pulsar:PulsarEmbeddedJobRunner
    pulsar_app_config:
      conda_auto_init: true
      conda_auto_install: true
execution:
  default: pulsar
  environments:
    pulsar:
      runner: pulsar
      dependency_resolution: remote
    local_environment:
      runner: local
tools:
  # These command templates read their input or config file while Galaxy builds
  # the command. With rewrite_parameters (the embedded runner's default) the
  # template sees Pulsar paths that are not staged yet; only remote tool
  # evaluation supports them, which Galaxy's own integration tests cover.
  - id: command_reads_input_size
    environment: local_environment
  - id: command_reads_configfile
    environment: local_environment
  - class: local
    environment: local_environment
