[settings]
combine_as_imports=true
extend_skip=doc/*,scripts/*
force_alphabetical_sort_within_sections=true
# Override force_grid_wrap value from profile=black, but black is still happy
force_grid_wrap=2
# `harness` (test/resilience/harness) and `recorder` (test/resilience/mock_galaxy)
# are top-level at runtime via test/resilience/pytest.ini, so isort files them
# as third party without this.
known_first_party=harness,recorder
line_length=140
no_lines_before=LOCALFOLDER
profile=black
reverse_relative=true
skip_gitignore=true
# Make isort run faster by skipping database
skip_glob=database/*
src_paths=pulsar,test
